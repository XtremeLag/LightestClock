name: Build UltraLight Clock APK (self‑contained)

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate project files
        run: |
          # Create directory structure
          mkdir -p app/src/main/java/com/example/ultralightclock
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # Top-level build.gradle
          cat > build.gradle <<'EOF'
          // Top-level build file
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          # settings.gradle
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "UltraLightClock"
          include ':app'
          EOF

          # gradle.properties
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # app/build.gradle
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.ultralightclock'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.ultralightclock"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
              kotlinOptions {
                  jvmTarget = '1.8'
              }
          }

          dependencies {
              // ZERO external dependencies
          }
          EOF

          # proguard-rules.pro
          cat > app/proguard-rules.pro <<'EOF'
          -keep class com.example.ultralightclock.ClockWidget { *; }
          -keep class com.example.ultralightclock.ClockUpdateReceiver { *; }
          EOF

          # AndroidManifest.xml
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="UltraLight Clock"
                  android:icon="@drawable/ic_widget"
                  android:allowBackup="false">
                  <receiver
                      android:name=".ClockWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
                  <receiver android:name=".ClockUpdateReceiver" />
              </application>
          </manifest>
          EOF

          # AlarmHelper.kt
          cat > app/src/main/java/com/example/ultralightclock/AlarmHelper.kt <<'EOF'
          package com.example.ultralightclock

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.os.SystemClock

          object AlarmHelper {
              private const val ACTION_TICK = "com.example.ultralightclock.TICK"
              private const val INTERVAL_MS = 60000L

              fun set(context: Context) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, ClockUpdateReceiver::class.java).apply {
                      action = ACTION_TICK
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val triggerAt = SystemClock.elapsedRealtime() + INTERVAL_MS
                  alarmManager.setExactAndAllowWhileIdle(
                      AlarmManager.ELAPSED_REALTIME_WAKEUP,
                      triggerAt,
                      pendingIntent
                  )
              }

              fun cancel(context: Context) {
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  val intent = Intent(context, ClockUpdateReceiver::class.java).apply {
                      action = ACTION_TICK
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager.cancel(pendingIntent)
              }
          }
          EOF

          # ClockDrawer.kt
          cat > app/src/main/java/com/example/ultralightclock/ClockDrawer.kt <<'EOF'
          package com.example.ultralightclock

          import android.appwidget.AppWidgetManager
          import android.content.Context
          import android.graphics.*
          import android.widget.RemoteViews
          import java.text.SimpleDateFormat
          import java.util.*

          object ClockDrawer {
              private const val WIDGET_WIDTH = 440
              private const val WIDGET_HEIGHT = 180

              fun update(context: Context, manager: AppWidgetManager, widgetId: Int) {
                  val bitmap = Bitmap.createBitmap(WIDGET_WIDTH, WIDGET_HEIGHT, Bitmap.Config.ARGB_8888)
                  val canvas = Canvas(bitmap)

                  drawBackground(canvas)
                  drawTime12H(canvas)
                  drawDate(canvas)

                  val views = RemoteViews(context.packageName, R.layout.widget).apply {
                      setImageViewBitmap(R.id.clock_image, bitmap)
                  }
                  manager.updateAppWidget(widgetId, views)
              }

              private fun drawBackground(canvas: Canvas) {
                  canvas.drawColor(Color.parseColor("#1A1A1A"))
                  val paint = Paint().apply {
                      color = Color.parseColor("#333333")
                      style = Paint.Style.STROKE
                      strokeWidth = 4f
                  }
                  canvas.drawRect(2f, 2f, WIDGET_WIDTH - 2f, WIDGET_HEIGHT - 2f, paint)
              }

              private fun drawTime12H(canvas: Canvas) {
                  val calendar = Calendar.getInstance()
                  val hour = calendar.get(Calendar.HOUR)
                  val displayHour = if (hour == 0) 12 else hour
                  val minute = calendar.get(Calendar.MINUTE)
                  val amPm = calendar.get(Calendar.AM_PM)
                  val amPmText = if (amPm == Calendar.AM) "AM" else "PM"

                  val timeText = String.format("%d:%02d", displayHour, minute)

                  val timePaint = Paint().apply {
                      color = Color.WHITE
                      textSize = 96f
                      isAntiAlias = true
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  val timeBounds = Rect()
                  timePaint.getTextBounds(timeText, 0, timeText.length, timeBounds)
                  val timeX = (WIDGET_WIDTH - timeBounds.width()) / 2f - 30f
                  val timeY = WIDGET_HEIGHT * 0.55f
                  canvas.drawText(timeText, timeX, timeY, timePaint)

                  val amPmPaint = Paint().apply {
                      color = Color.parseColor("#4CAF50")
                      textSize = 28f
                      isAntiAlias = true
                      typeface = Typeface.DEFAULT_BOLD
                  }
                  canvas.drawText(amPmText, timeX + timeBounds.width() + 20f, timeY - 10f, amPmPaint)

                  val sec = String.format("%02d", calendar.get(Calendar.SECOND))
                  val secPaint = Paint().apply {
                      color = Color.parseColor("#888888")
                      textSize = 24f
                      isAntiAlias = true
                  }
                  canvas.drawText(sec, timeX + timeBounds.width() + 25f, timeY + 25f, secPaint)
              }

              private fun drawDate(canvas: Canvas) {
                  val date = SimpleDateFormat("EEE, MMM d", Locale.getDefault()).format(Date())
                  val paint = Paint().apply {
                      color = Color.parseColor("#AAAAAA")
                      textSize = 28f
                      isAntiAlias = true
                  }
                  val bounds = Rect()
                  paint.getTextBounds(date, 0, date.length, bounds)
                  val x = (WIDGET_WIDTH - bounds.width()) / 2f
                  val y = WIDGET_HEIGHT * 0.85f
                  canvas.drawText(date, x, y, paint)
              }
          }
          EOF

          # ClockUpdateReceiver.kt
          cat > app/src/main/java/com/example/ultralightclock/ClockUpdateReceiver.kt <<'EOF'
          package com.example.ultralightclock

          import android.appwidget.AppWidgetManager
          import android.content.BroadcastReceiver
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent

          class ClockUpdateReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val mgr = AppWidgetManager.getInstance(context)
                  val ids = mgr.getAppWidgetIds(ComponentName(context, ClockWidget::class.java))
                  for (id in ids) {
                      ClockDrawer.update(context, mgr, id)
                  }
                  AlarmHelper.set(context)
              }
          }
          EOF

          # ClockWidget.kt
          cat > app/src/main/java/com/example/ultralightclock/ClockWidget.kt <<'EOF'
          package com.example.ultralightclock

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context

          class ClockWidget : AppWidgetProvider() {
              override fun onUpdate(
                  context: Context,
                  appWidgetManager: AppWidgetManager,
                  appWidgetIds: IntArray
              ) {
                  for (appWidgetId in appWidgetIds) {
                      ClockDrawer.update(context, appWidgetManager, appWidgetId)
                  }
                  AlarmHelper.set(context)
              }

              override fun onEnabled(context: Context) {
                  AlarmHelper.set(context)
              }

              override fun onDisabled(context: Context) {
                  AlarmHelper.cancel(context)
              }
          }
          EOF

          # ic_widget.xml
          cat > app/src/main/res/drawable/ic_widget.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM12,20c-4.41,0 -8,-3.59 -8,-8s3.59,-8 8,-8 8,3.59 8,8 -3.59,8 -8,8zM12.5,7H11v6l5.25,3.15 0.75,-1.23 -4.5,-2.67z"/>
          </vector>
          EOF

          # widget.xml
          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ImageView xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/clock_image"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:contentDescription="Clock Widget" />
          EOF

          # colors.xml
          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources>
              <color name="bg_dark">#FF1A1A1A</color>
              <color name="text_white">#FFFFFFFF</color>
              <color name="text_accent">#FF4CAF50</color>
              <color name="text_dim">#FFAAAAAA</color>
          </resources>
          EOF

          # strings.xml
          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">UltraLight Clock</string>
          </resources>
          EOF

          # themes.xml
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.UltraLightClock" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # widget_info.xml
          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="130dp"
              android:minHeight="50dp"
              android:minResizeWidth="110dp"
              android:minResizeHeight="40dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Build release APK (unsigned)
        run: gradle assembleRelease

      - name: Generate keystore
        run: |
          keytool -genkey -v -keystore release.keystore \
            -alias mykey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"

      - name: Sign release APK with apksigner
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
